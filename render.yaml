services:
  - type: worker
    name: bailmeout-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --experimental-strip-types src/index.ts
    envVars:
      - key: SPECTRUM_PROJECT_ID
        sync: false
      - key: SPECTRUM_PROJECT_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TARGET_PHONE_NUMBER
        sync: false
      - key: SAFE_WORD
        value: code red
      - key: OTEL_SDK_DISABLED
        value: "true"
